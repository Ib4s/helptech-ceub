<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro - HelpTech CEUB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <!-- Script que mostra ou esconde as datas dependendo do tipo de conta -->
    <script>
        function verificarTipo() {
            var tipo = document.getElementById("tipo").value;
            var divTecnico = document.getElementById("dados_tecnico");
            // Se escolher técnico, mostra a div. Se não, esconde.
            if (tipo === "tecnico") {
                divTecnico.style.display = "block";
            } else {
                divTecnico.style.display = "none";
            }
        }
    </script>
</head>
<body>
    <h1>Criar Conta</h1>
    
    <!-- Formulário de criação de usuário -->
    <form action="/cadastro" method="POST">
        Nome: <input type="text" name="nome" required><br><br>
        Matrícula: <input type="text" name="matricula" required><br><br>
        E-mail: <input type="email" name="email" required><br><br>
        Data de Nascimento: <input type="date" name="data_nascimento" required><br><br>
        Senha: <input type="password" name="senha" required><br><br>
        
        <!-- Seleção do tipo de conta que aciona o script acima -->
        Tipo de Conta:
        <select name="tipo" id="tipo" onchange="verificarTipo()" required>
            <option value="solicitante">Cliente (Preciso de ajuda)</option>
            <option value="tecnico">Técnico (Quero prestar suporte)</option>
        </select><br><br>
        
        <!-- Bloco oculto que só aparece se a conta for de Técnico -->
        <div id="dados_tecnico" style="display:none; padding:15px; margin-bottom:15px; border-radius:6px; border: 1px solid var(--border-color); background-color: var(--bg-color);">
            Início do Curso: <input type="date" name="inicio_curso"><br><br>
            Previsão de Término: <input type="date" name="previsao_termino"><br><br>
        </div>
        
        <button type="submit">Finalizar Cadastro</button>
    </form>
    
    <br><a href="/">Voltar</a>
</body>
</html>
